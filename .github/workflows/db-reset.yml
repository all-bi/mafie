# Ruční údržba: smaže VŠECHNY hry z produkční D1 databáze (hráče, vraždy,
# odběry upozornění, kódy přenosu). Struktura tabulek zůstane.
# Spuštění: Actions → „Smazat všechny hry“ → Run workflow → do pole napiš SMAZAT.
# Obnova je možná do 7 dní přes D1 Time Travel (viz README).

name: Smazat všechny hry

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Pro potvrzení napiš SMAZAT'
        required: true

permissions:
  contents: read

jobs:
  reset:
    if: ${{ inputs.confirm == 'SMAZAT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 20fad3598c1bdc2e46b244920847eeca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Token
        run: |
          token=$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Stav před smazáním
        run: npx wrangler d1 execute DB --remote --command "SELECT (SELECT COUNT(*) FROM games) AS hry, (SELECT COUNT(*) FROM players) AS hraci, (SELECT COUNT(*) FROM kill_reports) AS vrazdy, (SELECT COUNT(*) FROM push_subscriptions) AS odbery"
      - name: Smazání všech her
        run: |
          npx wrangler d1 execute DB --remote --command "DELETE FROM kill_reports; DELETE FROM push_subscriptions; DELETE FROM transfer_codes; UPDATE games SET admin_player_id = NULL; UPDATE players SET target_id = NULL; DELETE FROM players; DELETE FROM games;"
      - name: Stav po smazání
        run: npx wrangler d1 execute DB --remote --command "SELECT (SELECT COUNT(*) FROM games) AS hry, (SELECT COUNT(*) FROM players) AS hraci, (SELECT COUNT(*) FROM kill_reports) AS vrazdy, (SELECT COUNT(*) FROM push_subscriptions) AS odbery"
